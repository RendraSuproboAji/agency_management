server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Selaras dengan upload_max_filesize/post_max_size di docker/php.ini.
    client_max_body_size 260M;

    # Unduhan deliverable bisa ratusan MB; biarkan kernel yang memindahkannya.
    sendfile on;
    tcp_nopush on;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Berkas unggahan: disajikan apa adanya, tidak pernah dieksekusi, dan
    # browser tidak boleh menebak tipenya. Menggantikan blok Apache sebelumnya.
    location ^~ /storage/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Frame-Options "DENY" always;

        location ~ \.(php|phtml|phar|cgi|pl|sh)$ {
            return 403;
        }
    }

    # Aset ber-hash dari Vite aman di-cache lama.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;

        # Berkas 3D besar butuh waktu lebih dari default 60 detik.
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
