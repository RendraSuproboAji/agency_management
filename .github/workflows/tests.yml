name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # CI tidak pernah membangun frontend, jadi JSX yang rusak lolos sampai
      # ketahuan di browser. Build-nya cepat dan menutup celah itu.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Execute tests
        run: php artisan test

      # Menjalankan aplikasi sungguhan di browser: menangkap gulir menyamping
      # dan error konsol yang tidak terlihat oleh 204 tes PHP.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Seed a database for the browser test
        run: |
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: rahasia12345
          SEED_DEMO: 'true'
          # Menyalakan portal untuk satu klien demo supaya portal klien ikut
          # teruji; tanpa ini seeder sengaja tidak membuat akun klien.
          DEMO_CLIENT_PASSWORD: rahasia12345

      - name: Responsive regression test
        run: |
          php artisan serve --port=8000 &
          until curl -sf -o /dev/null http://127.0.0.1:8000/login; do sleep 1; done
          node tests/e2e/responsive.mjs
        env:
          APP_TEST_EMAIL: admin@example.com
          APP_TEST_PASSWORD: rahasia12345
          APP_TEST_CLIENT_EMAIL: studio-interior-nusantara@example.com
          APP_TEST_CLIENT_PASSWORD: rahasia12345
